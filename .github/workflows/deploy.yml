name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-deluxewindows
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    steps:
      - name: Pull on production via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            PHP_BIN=/opt/php83/bin/php
            if [ ! -x "$PHP_BIN" ]; then
              PHP_BIN=php
            fi
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            "$PHP_BIN" artisan migrate --force
            "$PHP_BIN" artisan optimize:clear
            find . -user root -exec chown www-root:www-root {} +
            if systemctl list-unit-files deluxe-windows-queue.service --no-legend | grep -q deluxe-windows-queue; then
              systemctl restart deluxe-windows-queue || true
            fi
            echo "Deployed $(git rev-parse --short HEAD)"
